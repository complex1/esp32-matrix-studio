name: Matrix Studio checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ESP32_Matrix_Display_Module
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify embedded browser assets are current
        run: node scripts/embed_web.mjs --check
      - name: Run all browser-module tests
        run: node --test web/*.test.mjs
      - name: Run four native C++ suites with sanitizers
        run: bash scripts/check-native.sh
        env:
          CXX: g++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Verify the Pages bundle can be staged
        run: node scripts/build-pages.mjs "$RUNNER_TEMP/matrix-studio-check"
